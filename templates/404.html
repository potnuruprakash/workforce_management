{% extends 'base.html' %}

{% block title %}404 Not Found — Workforce OS{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="empty-state-icon text-primary" style="width: 72px; height: 72px; font-size: 2.2rem; background: #eff6ff;">
            <i class="bi bi-search"></i>
        </div>
        <h1 class="h2 fw-bold mt-2">Page or Record Not Found</h1>
        <p class="text-secondary fs-8 mb-4">
            The requested resource could not be located. It may have been archived, relocated, or belongs to another organization.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="{% url 'dashboard:index' %}" class="btn btn-primary">
                <i class="bi bi-grid-1x2"></i> Dashboard
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Go Back
            </a>
        </div>
    </div>
</div>
{% endblock %}
